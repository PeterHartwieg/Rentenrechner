name: main-verify

on:
  push:
    branches: [main]
  schedule:
    # Twice daily, off the hour: 08:17 / 20:17 JST. Rules 3/10: cheap SHA
    # gate skips unchanged main; no repeated heavy work after a green push.
    - cron: '17 23 * * *'
    - cron: '17 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ci-cost-lint: focused SHA selector only, no tests
  gate: # ci-cost-lint: skip-guard scheduled SHA lookup accepts successful runs from any event
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Skip schedules already verified at this SHA
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT" = schedule ]; then
            green=$(gh api "repos/$GH_REPO/actions/workflows/main-verify.yml/runs?branch=main&head_sha=$SHA&status=success&per_page=1" --jq '.total_count')
            if [ "$green" -gt 0 ]; then
              echo 'nothing merged since the last green full run' | tee -a "$GITHUB_STEP_SUMMARY"
              echo 'run=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo 'run=true' >> "$GITHUB_OUTPUT"

  full: # ci-cost-lint: full-ok pre-deploy full run: every push to main is a production deploy via Cloudflare Workers Builds
    name: Full verify
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          for worker in workers/qa-submit workers/simulate; do
            if [ -f "$worker/package-lock.json" ]; then
              npm --prefix "$worker" ci
            fi
          done

      - name: Audit all dependencies (informational)
        continue-on-error: true
        shell: bash
        run: |
          audit_status=0
          npm audit > "$RUNNER_TEMP/npm-audit.txt" 2>&1 || audit_status=$?
          {
            echo '### Full npm audit (including dev dependencies; informational)'
            echo '```text'
            cat "$RUNNER_TEMP/npm-audit.txt"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$audit_status"

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run full verify
        run: npm run verify

      - name: Select scenario artifact inputs
        id: scenario
        if: success() || failure()
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          relevant=true
          if [ "$EVENT" = push ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            relevant=false
            if git diff --name-only "$BEFORE" HEAD | grep -E '^(src/(engine|rules|domain|app|utils|data|test/scenarioReports)/|src/test/externalGoldenFixtures\.ts$|scripts/scenario[^/]*\.(ts|mjs)$|package(-lock)?\.json$|\.github/workflows/main-verify\.yml$)' > /dev/null; then
              relevant=true
            fi
          fi
          echo "run=$relevant" >> "$GITHUB_OUTPUT"

      - name: Generate scenario report
        if: (success() || failure()) && steps.scenario.outputs.run == 'true'
        run: npm run scenario:report

      - name: Upload scenario report
        if: (success() || failure()) && steps.scenario.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: scenario-report
          path: |
            artifacts/scenario-report.json
            artifacts/scenario-report.md
          if-no-files-found: warn
          retention-days: 30

  ci-red: # ci-cost-lint: full-ok failure notification only, no test suite
    needs: full
    if: >-
      failure() && needs.full.result == 'failure' && github.ref == 'refs/heads/main' &&
      contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name)
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: read
    steps:
      # No checkout: issue-writing code comes from the trusted main workflow.
      - uses: actions/github-script@v8
        with:
          script: |
            const repo = context.repo;
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...repo, run_id: context.runId, filter: 'latest', per_page: 100
            });
            const failed = jobs.filter(job => job.name === 'Full verify')
              .flatMap(job => job.steps.filter(step => step.conclusion === 'failure').map(step => step.name));
            const body = `SHA: ${context.sha}\nRun: ${context.serverUrl}/${repo.owner}/${repo.repo}/actions/runs/${context.runId}\nFailed steps: ${failed.join(', ') || 'job failed before step details were available'}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...repo, state: 'open', labels: 'ci-red', per_page: 100
            });
            const issue = issues.find(item => !item.pull_request);
            if (issue) {
              await github.rest.issues.createComment({ ...repo, issue_number: issue.number, body });
            } else {
              try {
                await github.rest.issues.getLabel({ ...repo, name: 'ci-red' });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ ...repo, name: 'ci-red', color: 'B60205', description: 'Main full verification needs attention' });
              }
              await github.rest.issues.create({ ...repo, title: '[ci-red] main full verify failed',
                labels: ['ci-red'], assignees: ['PeterHartwieg'], body });
            }

  resolve-ci-red: # ci-cost-lint: full-ok recovery notification only, no test suite
    needs: full
    if: >-
      needs.full.result == 'success' && github.ref == 'refs/heads/main' &&
      contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name)
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const repo = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...repo, state: 'open', labels: 'ci-red', per_page: 100
            });
            for (const issue of issues.filter(item => !item.pull_request)) {
              await github.rest.issues.createComment({ ...repo, issue_number: issue.number,
                body: `Full verify is green at ${context.sha}: ${context.serverUrl}/${repo.owner}/${repo.repo}/actions/runs/${context.runId}` });
              await github.rest.issues.update({ ...repo, issue_number: issue.number, state: 'closed', state_reason: 'completed' });
            }
