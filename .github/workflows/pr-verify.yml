name: pr-verify

# Standalone `npm run verify` for EVERY pull request, regardless of head
# branch (agent/issue-*, automation/retro-curate-*, codex/*, feat/*, forks).
# Replaces the verify step that claude-review.yml used to invoke under Opus —
# runs the same lint+test+build without burning model tokens. claude-review.yml
# reads this check's result via `gh pr checks` instead of running verify
# itself.
#
# Also gates review-loop's merge step (review-loop re-checks before
# `gh pr merge --squash --delete-branch` per its own contract).
#
# Fork-safe by construction: `pull_request` (never `pull_request_target`)
# runs in the base repo with a read-only GITHUB_TOKEN, and this workflow
# declares `permissions: contents: read` and references no secrets — so PRs
# from forks can never reach credentials even though their code executes.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to verify"
        required: true
      head_sha:
        description: "Exact pull request head SHA to verify"
        required: true
      head_ref:
        description: "Pull request head branch"
        required: true

permissions:
  contents: read

concurrency:
  group: pr-verify-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.head_sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          for worker in workers/qa-submit workers/simulate; do
            if [ -f "$worker/package-lock.json" ]; then
              npm --prefix "$worker" ci
            fi
          done

      - name: Run verify
        run: npm run verify
