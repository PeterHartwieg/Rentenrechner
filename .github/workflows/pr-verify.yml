name: pr-verify

# Keep required job `verify`; no workflow path filters. Fork-safe:
# pull_request, read-only token, no secrets or issue-writing jobs.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to verify
        required: true
      head_sha:
        description: Exact pull request head SHA to verify
        required: true
      head_ref:
        description: Pull request head branch
        required: true
      suite:
        description: Verification suite
        type: choice
        options: [focused, full]
        default: full

permissions:
  contents: read

concurrency:
  group: pr-verify-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          for worker in workers/qa-submit workers/simulate; do
            if [ -f "$worker/package-lock.json" ]; then
              npm --prefix "$worker" ci
            fi
          done

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run focused verification (automatically escalates broad/high-risk diffs)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || 'origin/main' }}
          SUITE: ${{ inputs.suite || 'focused' }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--base "$BASE_SHA")
          if [ "$SUITE" = full ]; then args+=(--full); fi
          npm run verify:focused -- "${args[@]}"
